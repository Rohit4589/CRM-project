<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA8336" />
      <stop offset="45%" stop-color="#A56A30" />
      <stop offset="100%" stop-color="#733C0F" />
    </linearGradient>
    <linearGradient id="topGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="mShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="0.75" flood-color="#2D1502" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Centered Rounded Squircle (58x58 inside 64x64, r=13.5) -->
  <rect x="3" y="3" width="58" height="58" rx="13.5" fill="url(#bgGrad)" />
  <rect x="3" y="3" width="58" height="58" rx="13.5" fill="url(#topGleam)" />
  <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="12.75" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.2" />

  <!-- Bold Architectural Brand 'M' -->
  <path d="M 14 49 L 14 15 L 22.5 15 L 32 29.5 L 41.5 15 L 50 15 L 50 49 L 42 49 L 42 28 L 34.5 39.5 L 29.5 39.5 L 22 28 L 22 49 Z" 
        fill="#FFFFFF" 
        filter="url(#mShadow)" />
</svg>